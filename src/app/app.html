<h1>Enterprise Employee Portal</h1>

<hr>

<h2>Add Employee</h2>

<app-add-employee-form
  (addEmployee)="addEmployee($event)">
</app-add-employee-form>

<hr>

<h2>Dashboard Summary</h2>

<p>
  Total Employees:
  {{ totalEmployees() }}
</p>

<p>
  Total Salary:
  ₹ {{ totalSalary() }}
</p>

<hr>

<h2>Employee List</h2>

<app-employee-card
  *ngFor="let emp of employees()"
  [employee]="emp"
  (remove)="removeEmployee($event)">
</app-employee-card>
