<div class="employee-card">

  <h2>{{ employee.name }}</h2>

  <p>
    <strong>Designation:</strong>
    {{ employee.designation }}
  </p>

  <p>
    <strong>Department:</strong>
    {{ employee.department }}
  </p>

  <p>
    <strong>Salary:</strong>
    ₹ {{ employee.salary }}
  </p>

  <button (click)="onRemove()">
    Remove
  </button>

</div>
